<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code 加圖片工具</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --primary: #111827;
      --primary-soft: #f3f4f6;
      --danger: #b91c1c;
      --ok: #166534;
      --warn: #92400e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", sans-serif;
      padding: 24px;
    }
    .container { max-width: 980px; margin: 0 auto; }
    .card {
      background: var(--card);
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(17,24,39,.08);
      padding: 24px;
    }
    h1 { margin: 0 0 10px; font-size: 30px; }
    .lead { margin: 0 0 20px; line-height: 1.7; color: #374151; }
    label { display: block; margin: 14px 0 8px; font-weight: 650; }
    input[type="text"], input[type="file"], select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 16px;
      background: #fff;
    }
    input[type="range"] { width: 100%; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 180px 180px;
      gap: 12px;
      align-items: end;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: end;
      margin-top: 2px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      align-items: end;
      margin-top: 2px;
    }
    @media (max-width: 820px) {
      .grid, .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    button {
      appearance: none;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 16px;
      cursor: pointer;
    }
    button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .message { min-height: 24px; margin-top: 14px; font-size: 15px; line-height: 1.6; }
    .message.error { color: var(--danger); }
    .message.ok { color: var(--ok); }
    .message.warn { color: var(--warn); }
    .preview {
      margin-top: 22px;
      border: 2px dashed var(--border);
      border-radius: 14px;
      padding: 24px;
      text-align: center;
      background: #fafafa;
      overflow-x: auto;
    }
    #qrcodeWrap {
      display: inline-block;
      background: #fff;
      padding: 14px;
      border-radius: 14px;
      box-shadow: 0 4px 12px rgba(0,0,0,.04);
      max-width: 100%;
    }
    #qrcodeCanvas {
      display: block;
      max-width: 100%;
      height: auto;
    }
    .hint, .mini {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .note {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #f8fafc;
      color: #475569;
      line-height: 1.7;
      font-size: 14px;
    }
    .options-box {
      margin-top: 16px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fcfcfd;
    }
    .checkrow {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
      color: #374151;
      font-size: 15px;
    }
    .checkrow input { width: 18px; height: 18px; }
    .range-value {
      display: inline-block;
      min-width: 44px;
      font-variant-numeric: tabular-nums;
      color: #111827;
      font-weight: 650;
    }
    .pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: #374151;
      font-size: 12px;
      margin-left: 6px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>QR Code 加圖片工具</h1>
      <p class="lead">輸入網址或文字後，可上載校徽、學校名橫幅或其他圖片，選擇放在 QR Code 中間或右下角，再下載成 PNG。</p>

      <label for="contentInput">網址／文字</label>
      <div class="grid">
        <div>
          <input id="contentInput" type="text" placeholder="例如：https://example.com 或 example.com" value="">
        </div>
        <div>
          <label for="sizeSelect">輸出尺寸</label>
          <select id="sizeSelect">
            <option value="300">300 × 300</option>
            <option value="500" selected>500 × 500</option>
            <option value="1000">1000 × 1000</option>
            <option value="1500">1500 × 1500</option>
            <option value="2000">2000 × 2000</option>
          </select>
        </div>
        <div>
          <label for="levelSelect">容錯級別</label>
          <select id="levelSelect">
            <option value="L">L</option>
            <option value="M">M</option>
            <option value="Q">Q</option>
            <option value="H" selected>H（建議）</option>
          </select>
        </div>
      </div>

      <div class="options-box">
        <div class="grid-2">
          <div>
            <label for="logoInput">上載圖片 <span class="pill">校徽／橫幅／Logo</span></label>
            <input id="logoInput" type="file" accept="image/*">
            <div class="mini" id="logoStatus">未上載圖片時，只會產生普通 QR Code。</div>
          </div>
          <div>
            <label for="positionSelect">圖片位置</label>
            <select id="positionSelect">
              <option value="center" selected>中間（會遮住部分 QR Code，請用 H 容錯）</option>
              <option value="inside-bottom-right">右下角（在 QR Code 內）</option>
              <option value="outside-bottom-right">右下角（放在 QR Code 下方白色品牌區，最穩陣）</option>
            </select>
          </div>
        </div>

        <div class="grid-3">
          <div>
            <label for="logoSizeRange">圖片大小：<span class="range-value" id="logoSizeValue">28%</span></label>
            <input id="logoSizeRange" type="range" min="10" max="60" value="28" step="1">
          </div>
          <div>
            <label for="paddingRange">白底留邊：<span class="range-value" id="paddingValue">4%</span></label>
            <input id="paddingRange" type="range" min="0" max="12" value="4" step="1">
          </div>
          <div>
            <label for="marginRange">距離邊緣：<span class="range-value" id="marginValue">5%</span></label>
            <input id="marginRange" type="range" min="1" max="12" value="5" step="1">
          </div>
        </div>

        <label class="checkrow" for="whiteBgCheck">
          <input id="whiteBgCheck" type="checkbox" checked>
          圖片後方加白底，提升辨識度
        </label>
      </div>

      <div class="actions">
        <button class="primary" id="generateBtn">產生 QR Code</button>
        <button id="downloadBtn" disabled>下載 PNG</button>
        <button id="clearLogoBtn">清除圖片</button>
        <button id="clearBtn">全部清除</button>
      </div>

      <div class="message" id="message"></div>

      <div class="preview">
        <div id="qrcodeWrap">
          <canvas id="qrcodeCanvas" width="500" height="500" aria-label="QR Code 預覽"></canvas>
        </div>
        <div class="hint">此版本不依賴外部程式庫。圖片和文字只會在瀏覽器本機處理，不會上傳到伺服器。</div>
      </div>

      <div class="note">
        建議：如使用校名橫幅，較適合放在「右下角（白色品牌區）」；如使用單一校徽，可放在中間，但圖片大小宜控制在 20%–30% 左右，並使用 H 容錯級別。若圖片放在 QR Code 內，下載後請用手機實測掃描。
      </div>
    </div>
  </div>

  <script>
    // Self-contained QR Code generator, supporting Byte mode and QR versions 1-10.
    const RS_BLOCKS = {
      1:{L:[[1,26,19]],M:[[1,26,16]],Q:[[1,26,13]],H:[[1,26,9]]},
      2:{L:[[1,44,34]],M:[[1,44,28]],Q:[[1,44,22]],H:[[1,44,16]]},
      3:{L:[[1,70,55]],M:[[1,70,44]],Q:[[2,35,17]],H:[[2,35,13]]},
      4:{L:[[1,100,80]],M:[[2,50,32]],Q:[[2,50,24]],H:[[4,25,9]]},
      5:{L:[[1,134,108]],M:[[2,67,43]],Q:[[2,33,15],[2,34,16]],H:[[2,33,11],[2,34,12]]},
      6:{L:[[2,86,68]],M:[[4,43,27]],Q:[[4,43,19]],H:[[4,43,15]]},
      7:{L:[[2,98,78]],M:[[4,49,31]],Q:[[2,32,14],[4,33,15]],H:[[4,39,13],[1,40,14]]},
      8:{L:[[2,121,97]],M:[[2,60,38],[2,61,39]],Q:[[4,40,18],[2,41,19]],H:[[4,40,14],[2,41,15]]},
      9:{L:[[2,146,116]],M:[[3,58,36],[2,59,37]],Q:[[4,36,16],[4,37,17]],H:[[4,36,12],[4,37,13]]},
      10:{L:[[2,86,68],[2,87,69]],M:[[4,69,43],[1,70,44]],Q:[[6,43,19],[2,44,20]],H:[[6,43,15],[2,44,16]]}
    };
    const ALIGNMENT = {
      1:[], 2:[6,18], 3:[6,22], 4:[6,26], 5:[6,30],
      6:[6,34], 7:[6,22,38], 8:[6,24,42], 9:[6,26,46], 10:[6,28,50]
    };
    const ECL_FORMAT_BITS = { L:1, M:0, Q:3, H:2 };
    const EXP = new Array(512);
    const LOG = new Array(256);
    (function initGF() {
      let x = 1;
      for (let i = 0; i < 255; i++) {
        EXP[i] = x;
        LOG[x] = i;
        x <<= 1;
        if (x & 0x100) x ^= 0x11D;
      }
      for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
    })();

    function gfMul(x, y) {
      return (x === 0 || y === 0) ? 0 : EXP[LOG[x] + LOG[y]];
    }
    function rsGenerator(degree) {
      let gen = [1];
      for (let i = 0; i < degree; i++) {
        const next = new Array(gen.length + 1).fill(0);
        for (let j = 0; j < gen.length; j++) {
          next[j] ^= gen[j];
          next[j + 1] ^= gfMul(gen[j], EXP[i]);
        }
        gen = next;
      }
      return gen;
    }
    function rsRemainder(data, degree) {
      const gen = rsGenerator(degree);
      const rem = new Array(degree).fill(0);
      for (const b of data) {
        const factor = b ^ rem[0];
        rem.shift();
        rem.push(0);
        for (let i = 0; i < degree; i++) rem[i] ^= gfMul(gen[i + 1], factor);
      }
      return rem;
    }
    function totalDataCodewords(version, level) {
      return RS_BLOCKS[version][level].reduce((sum, group) => sum + group[0] * group[2], 0);
    }
    function addBits(arr, val, len) {
      for (let i = len - 1; i >= 0; i--) arr.push((val >>> i) & 1);
    }
    function textToBytes(text) {
      if (typeof TextEncoder !== 'undefined') return Array.from(new TextEncoder().encode(text));
      return Array.from(unescape(encodeURIComponent(text))).map(ch => ch.charCodeAt(0));
    }
    function chooseVersion(bytes, level) {
      for (let version = 1; version <= 10; version++) {
        const lenBits = version < 10 ? 8 : 16;
        const capacity = totalDataCodewords(version, level) * 8;
        if (4 + lenBits + bytes.length * 8 <= capacity) return version;
      }
      throw new Error('內容太長，這個離線版暫支援至 QR Code Version 10。請縮短網址或使用短連結。');
    }
    function makeDataCodewords(bytes, version, level) {
      const dataCodewords = totalDataCodewords(version, level);
      const capacity = dataCodewords * 8;
      const lenBits = version < 10 ? 8 : 16;
      const bits = [];
      addBits(bits, 4, 4);
      addBits(bits, bytes.length, lenBits);
      bytes.forEach(b => addBits(bits, b, 8));
      addBits(bits, 0, Math.min(4, capacity - bits.length));
      while (bits.length % 8 !== 0) bits.push(0);
      const words = [];
      for (let i = 0; i < bits.length; i += 8) {
        let value = 0;
        for (let j = 0; j < 8; j++) value = (value << 1) | bits[i + j];
        words.push(value);
      }
      for (let pad = 0; words.length < dataCodewords; pad++) words.push(pad % 2 === 0 ? 0xEC : 0x11);
      return words;
    }
    function makeCodewords(data, version, level) {
      const specs = RS_BLOCKS[version][level];
      const blocks = [];
      let offset = 0;
      for (const [count, total, dataCount] of specs) {
        for (let i = 0; i < count; i++) {
          const dat = data.slice(offset, offset + dataCount);
          offset += dataCount;
          const ec = rsRemainder(dat, total - dataCount);
          blocks.push({ data: dat, ec });
        }
      }
      const result = [];
      const maxData = Math.max(...blocks.map(b => b.data.length));
      for (let i = 0; i < maxData; i++) for (const b of blocks) if (i < b.data.length) result.push(b.data[i]);
      const maxEc = Math.max(...blocks.map(b => b.ec.length));
      for (let i = 0; i < maxEc; i++) for (const b of blocks) if (i < b.ec.length) result.push(b.ec[i]);
      return result;
    }
    function bitLen(x) {
      let len = 0;
      while (x !== 0) {
        len++;
        x >>>= 1;
      }
      return len;
    }
    function getBit(x, i) {
      return ((x >>> i) & 1) !== 0;
    }
    function bchFormat(data) {
      let d = data << 10;
      const g = 0x537;
      while (bitLen(d) - bitLen(g) >= 0) d ^= g << (bitLen(d) - bitLen(g));
      return ((data << 10) | d) ^ 0x5412;
    }
    function bchVersion(version) {
      let d = version << 12;
      const g = 0x1F25;
      while (bitLen(d) - bitLen(g) >= 0) d ^= g << (bitLen(d) - bitLen(g));
      return (version << 12) | d;
    }
    function createQRCodeMatrix(text, level) {
      const bytes = textToBytes(text);
      const version = chooseVersion(bytes, level);
      const data = makeDataCodewords(bytes, version, level);
      const codewords = makeCodewords(data, version, level);
      return makeMatrix(version, level, codewords);
    }
    function makeMatrix(version, level, codewords) {
      const size = 21 + 4 * (version - 1);
      const modules = Array.from({ length: size }, () => Array(size).fill(false));
      const isFunc = Array.from({ length: size }, () => Array(size).fill(false));
      function setFunc(x, y, dark) {
        if (x < 0 || y < 0 || x >= size || y >= size) return;
        modules[y][x] = !!dark;
        isFunc[y][x] = true;
      }
      function drawFinder(cx, cy) {
        for (let dy = -4; dy <= 4; dy++) {
          for (let dx = -4; dx <= 4; dx++) {
            const x = cx + dx;
            const y = cy + dy;
            if (x < 0 || y < 0 || x >= size || y >= size) continue;
            const dist = Math.max(Math.abs(dx), Math.abs(dy));
            setFunc(x, y, dist !== 2 && dist !== 4);
          }
        }
      }
      function drawAlignment(cx, cy) {
        for (let dy = -2; dy <= 2; dy++) {
          for (let dx = -2; dx <= 2; dx++) {
            setFunc(cx + dx, cy + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
          }
        }
      }
      drawFinder(3, 3);
      drawFinder(size - 4, 3);
      drawFinder(3, size - 4);
      for (let i = 0; i < size; i++) {
        if (!isFunc[6][i]) setFunc(i, 6, i % 2 === 0);
        if (!isFunc[i][6]) setFunc(6, i, i % 2 === 0);
      }
      const positions = ALIGNMENT[version];
      for (const y of positions) {
        for (const x of positions) {
          if ((x === 6 && y === 6) || (x === 6 && y === size - 7) || (x === size - 7 && y === 6)) continue;
          drawAlignment(x, y);
        }
      }
      for (let i = 0; i <= 5; i++) {
        setFunc(8, i, false);
        setFunc(i, 8, false);
      }
      setFunc(8, 7, false);
      setFunc(8, 8, false);
      setFunc(7, 8, false);
      for (let i = 0; i < 8; i++) setFunc(size - 1 - i, 8, false);
      for (let i = 8; i < 15; i++) setFunc(8, size - 15 + i, false);
      setFunc(8, size - 8, true);
      if (version >= 7) {
        const bits = bchVersion(version);
        for (let i = 0; i < 18; i++) {
          const bit = getBit(bits, i);
          const a = size - 11 + (i % 3);
          const b = Math.floor(i / 3);
          setFunc(a, b, bit);
          setFunc(b, a, bit);
        }
      }
      let bitIndex = 0;
      let upward = true;
      const totalBits = codewords.length * 8;
      for (let right = size - 1; right >= 1; right -= 2) {
        if (right === 6) right--;
        for (let vert = 0; vert < size; vert++) {
          const y = upward ? size - 1 - vert : vert;
          for (let j = 0; j < 2; j++) {
            const x = right - j;
            if (!isFunc[y][x]) {
              let dark = false;
              if (bitIndex < totalBits) dark = ((codewords[bitIndex >>> 3] >>> (7 - (bitIndex & 7))) & 1) !== 0;
              modules[y][x] = dark;
              bitIndex++;
            }
          }
        }
        upward = !upward;
      }
      function maskBit(mask, x, y) {
        switch (mask) {
          case 0: return (x + y) % 2 === 0;
          case 1: return y % 2 === 0;
          case 2: return x % 3 === 0;
          case 3: return (x + y) % 3 === 0;
          case 4: return (Math.floor(y / 2) + Math.floor(x / 3)) % 2 === 0;
          case 5: return ((x * y) % 2 + (x * y) % 3) === 0;
          case 6: return (((x * y) % 2 + (x * y) % 3) % 2) === 0;
          case 7: return (((x + y) % 2 + (x * y) % 3) % 2) === 0;
        }
      }
      function drawFormat(mat, mask) {
        const bits = bchFormat((ECL_FORMAT_BITS[level] << 3) | mask);
        function put(x, y, bit) { mat[y][x] = bit; }
        for (let i = 0; i <= 5; i++) put(8, i, getBit(bits, i));
        put(8, 7, getBit(bits, 6));
        put(8, 8, getBit(bits, 7));
        put(7, 8, getBit(bits, 8));
        for (let i = 9; i < 15; i++) put(14 - i, 8, getBit(bits, i));
        for (let i = 0; i < 8; i++) put(size - 1 - i, 8, getBit(bits, i));
        for (let i = 8; i < 15; i++) put(8, size - 15 + i, getBit(bits, i));
        put(8, size - 8, true);
      }
      function applyMask(mask) {
        const mat = modules.map(row => row.slice());
        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            if (!isFunc[y][x] && maskBit(mask, x, y)) mat[y][x] = !mat[y][x];
          }
        }
        drawFormat(mat, mask);
        return mat;
      }
      function penalty(mat) {
        let p = 0;
        for (let y = 0; y < size; y++) {
          let runColor = mat[y][0];
          let run = 1;
          for (let x = 1; x < size; x++) {
            if (mat[y][x] === runColor) run++;
            else {
              if (run >= 5) p += 3 + run - 5;
              runColor = mat[y][x];
              run = 1;
            }
          }
          if (run >= 5) p += 3 + run - 5;
        }
        for (let x = 0; x < size; x++) {
          let runColor = mat[0][x];
          let run = 1;
          for (let y = 1; y < size; y++) {
            if (mat[y][x] === runColor) run++;
            else {
              if (run >= 5) p += 3 + run - 5;
              runColor = mat[y][x];
              run = 1;
            }
          }
          if (run >= 5) p += 3 + run - 5;
        }
        for (let y = 0; y < size - 1; y++) {
          for (let x = 0; x < size - 1; x++) {
            const c = mat[y][x];
            if (c === mat[y][x + 1] && c === mat[y + 1][x] && c === mat[y + 1][x + 1]) p += 3;
          }
        }
        const pat1 = '10111010000';
        const pat2 = '00001011101';
        for (let y = 0; y < size; y++) {
          const s = mat[y].map(v => v ? '1' : '0').join('');
          for (let i = 0; i <= size - 11; i++) {
            const sub = s.slice(i, i + 11);
            if (sub === pat1 || sub === pat2) p += 40;
          }
        }
        for (let x = 0; x < size; x++) {
          let s = '';
          for (let y = 0; y < size; y++) s += mat[y][x] ? '1' : '0';
          for (let i = 0; i <= size - 11; i++) {
            const sub = s.slice(i, i + 11);
            if (sub === pat1 || sub === pat2) p += 40;
          }
        }
        let dark = 0;
        for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (mat[y][x]) dark++;
        const total = size * size;
        p += Math.floor(Math.abs(dark * 20 - total * 10) / total) * 10;
        return p;
      }
      let bestMat = null;
      let bestPenalty = Infinity;
      let bestMask = 0;
      for (let mask = 0; mask < 8; mask++) {
        const mat = applyMask(mask);
        const score = penalty(mat);
        if (score < bestPenalty) {
          bestPenalty = score;
          bestMat = mat;
          bestMask = mask;
        }
      }
      return { size, modules: bestMat, mask: bestMask, version };
    }
  </script>

  <script>
    const contentInput = document.getElementById('contentInput');
    const sizeSelect = document.getElementById('sizeSelect');
    const levelSelect = document.getElementById('levelSelect');
    const logoInput = document.getElementById('logoInput');
    const logoStatus = document.getElementById('logoStatus');
    const positionSelect = document.getElementById('positionSelect');
    const logoSizeRange = document.getElementById('logoSizeRange');
    const logoSizeValue = document.getElementById('logoSizeValue');
    const paddingRange = document.getElementById('paddingRange');
    const paddingValue = document.getElementById('paddingValue');
    const marginRange = document.getElementById('marginRange');
    const marginValue = document.getElementById('marginValue');
    const whiteBgCheck = document.getElementById('whiteBgCheck');
    const generateBtn = document.getElementById('generateBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const clearLogoBtn = document.getElementById('clearLogoBtn');
    const clearBtn = document.getElementById('clearBtn');
    const message = document.getElementById('message');
    const previewCanvas = document.getElementById('qrcodeCanvas');

    let logoImage = null;
    let logoFileName = '';

    function setMessage(text, type = '') {
      message.textContent = text;
      message.className = 'message' + (type ? ' ' + type : '');
    }
    function updateRangeLabels() {
      logoSizeValue.textContent = logoSizeRange.value + '%';
      paddingValue.textContent = paddingRange.value + '%';
      marginValue.textContent = marginRange.value + '%';
    }
    function normalizeContent(raw) {
      const value = raw.trim();
      if (!value) return '';
      if (/^[a-z][a-z0-9+.-]*:/i.test(value)) return value;
      if (/^[^\s@]+\.[^\s]+$/.test(value)) return 'https://' + value;
      return value;
    }
    function drawPlaceholder() {
      const size = 500;
      previewCanvas.width = size;
      previewCanvas.height = size;
      const ctx = previewCanvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, size, size);
      ctx.strokeStyle = '#d1d5db';
      ctx.lineWidth = 4;
      ctx.setLineDash([16, 12]);
      ctx.strokeRect(24, 24, size - 48, size - 48);
      ctx.setLineDash([]);
      ctx.fillStyle = '#6b7280';
      ctx.font = '28px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('QR Code 預覽', size / 2, size / 2);
    }
    function loadImageFromFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error('圖片格式未能讀取'));
          img.src = reader.result;
        };
        reader.onerror = () => reject(new Error('未能讀取圖片'));
        reader.readAsDataURL(file);
      });
    }
    function fitImage(img, maxWidth, maxHeight) {
      const ratio = Math.min(maxWidth / img.naturalWidth, maxHeight / img.naturalHeight);
      return {
        width: Math.max(1, Math.round(img.naturalWidth * ratio)),
        height: Math.max(1, Math.round(img.naturalHeight * ratio))
      };
    }
    function roundRect(ctx, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + width - r, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + r);
      ctx.lineTo(x + width, y + height - r);
      ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
      ctx.lineTo(x + r, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }
    function drawLogo(ctx, img, x, y, w, h, pad, addWhiteBg) {
      if (addWhiteBg) {
        const radius = Math.max(6, Math.round(Math.min(w, h) * 0.14));
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(0,0,0,.10)';
        ctx.shadowBlur = Math.max(4, Math.round(Math.min(w, h) * 0.08));
        ctx.shadowOffsetY = Math.max(2, Math.round(Math.min(w, h) * 0.03));
        roundRect(ctx, x - pad, y - pad, w + pad * 2, h + pad * 2, radius);
        ctx.fill();
        ctx.restore();
      }
      ctx.drawImage(img, x, y, w, h);
    }
    function drawQRCodeToCanvas(text, size, level) {
      const qr = createQRCodeMatrix(text, level);
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, size, size);
      const quiet = 4;
      const count = qr.size;
      const total = count + quiet * 2;
      const cell = size / total;
      ctx.fillStyle = '#000000';
      for (let y = 0; y < count; y++) {
        for (let x = 0; x < count; x++) {
          if (qr.modules[y][x]) {
            const px = Math.round((x + quiet) * cell);
            const py = Math.round((y + quiet) * cell);
            const pw = Math.ceil((x + quiet + 1) * cell) - px;
            const ph = Math.ceil((y + quiet + 1) * cell) - py;
            ctx.fillRect(px, py, pw, ph);
          }
        }
      }
      return canvas;
    }
    async function generateQRCode() {
      try {
        setMessage('');
        const text = normalizeContent(contentInput.value);
        if (!text) {
          setMessage('請先輸入網址或文字。', 'error');
          return;
        }
        const size = parseInt(sizeSelect.value, 10);
        const level = levelSelect.value;
        const position = positionSelect.value;
        const logoPercent = parseInt(logoSizeRange.value, 10) / 100;
        const marginPercent = parseInt(marginRange.value, 10) / 100;
        const paddingPercent = parseInt(paddingRange.value, 10) / 100;

        const qrCanvas = drawQRCodeToCanvas(text, size, level);
        const outputCanvas = document.createElement('canvas');
        const outputCtx = outputCanvas.getContext('2d');
        let outputWidth = size;
        let outputHeight = size;
        let logoBox = null;

        if (logoImage) {
          const edgeMargin = Math.round(size * marginPercent);
          let maxLogoWidth = Math.round(size * logoPercent);
          let maxLogoHeight = Math.round(size * logoPercent);
          if (position === 'outside-bottom-right') {
            maxLogoWidth = Math.round(size * Math.min(logoPercent, 0.80));
            maxLogoHeight = Math.round(size * 0.20);
            const fitted = fitImage(logoImage, maxLogoWidth, maxLogoHeight);
            const pad = Math.round(size * paddingPercent);
            const barHeight = fitted.height + pad * 2 + edgeMargin * 2;
            outputHeight = size + barHeight;
            logoBox = {
              x: outputWidth - fitted.width - edgeMargin - pad,
              y: size + edgeMargin + pad,
              w: fitted.width,
              h: fitted.height,
              pad
            };
          } else {
            if (position === 'center') {
              maxLogoWidth = Math.round(size * Math.min(logoPercent, 0.45));
              maxLogoHeight = Math.round(size * Math.min(logoPercent, 0.30));
            } else {
              maxLogoWidth = Math.round(size * Math.min(logoPercent, 0.38));
              maxLogoHeight = Math.round(size * Math.min(logoPercent, 0.28));
            }
            const fitted = fitImage(logoImage, maxLogoWidth, maxLogoHeight);
            const pad = Math.round(size * paddingPercent);
            if (position === 'center') {
              logoBox = {
                x: Math.round((size - fitted.width) / 2),
                y: Math.round((size - fitted.height) / 2),
                w: fitted.width,
                h: fitted.height,
                pad
              };
            } else {
              logoBox = {
                x: Math.round(size - fitted.width - edgeMargin - pad),
                y: Math.round(size - fitted.height - edgeMargin - pad),
                w: fitted.width,
                h: fitted.height,
                pad
              };
            }
          }
        }
        outputCanvas.width = outputWidth;
        outputCanvas.height = outputHeight;
        outputCtx.fillStyle = '#ffffff';
        outputCtx.fillRect(0, 0, outputWidth, outputHeight);
        outputCtx.drawImage(qrCanvas, 0, 0, size, size);
        if (logoImage && logoBox) {
          drawLogo(outputCtx, logoImage, logoBox.x, logoBox.y, logoBox.w, logoBox.h, logoBox.pad, whiteBgCheck.checked);
        }
        previewCanvas.width = outputCanvas.width;
        previewCanvas.height = outputCanvas.height;
        const previewCtx = previewCanvas.getContext('2d');
        previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        previewCtx.drawImage(outputCanvas, 0, 0);
        downloadBtn.disabled = false;
        if (logoImage && position !== 'outside-bottom-right') {
          setMessage('已產生。圖片放在 QR Code 內部時，請下載後用手機試掃；如掃不到，可把圖片縮小或改用「右下角白色品牌區」。', 'warn');
        } else {
          setMessage('已產生，可下載 PNG。', 'ok');
        }
      } catch (err) {
        console.error(err);
        downloadBtn.disabled = true;
        setMessage(err.message || '產生 QR Code 時出現問題。', 'error');
      }
    }
    function downloadPNG() {
      const link = document.createElement('a');
      link.download = logoImage ? 'qrcode-with-logo.png' : 'qrcode.png';
      link.href = previewCanvas.toDataURL('image/png');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
    function clearLogo() {
      logoImage = null;
      logoFileName = '';
      logoInput.value = '';
      logoStatus.textContent = '未上載圖片時，只會產生普通 QR Code。';
      if (contentInput.value.trim()) generateQRCode();
    }
    function clearAll() {
      contentInput.value = '';
      sizeSelect.value = '500';
      levelSelect.value = 'H';
      positionSelect.value = 'center';
      logoSizeRange.value = '28';
      paddingRange.value = '4';
      marginRange.value = '5';
      whiteBgCheck.checked = true;
      clearLogo();
      updateRangeLabels();
      drawPlaceholder();
      setMessage('');
      downloadBtn.disabled = true;
    }
    logoInput.addEventListener('change', async () => {
      const file = logoInput.files && logoInput.files[0];
      if (!file) return;
      try {
        logoImage = await loadImageFromFile(file);
        logoFileName = file.name;
        logoStatus.textContent = '已上載：' + logoFileName + '（' + logoImage.naturalWidth + ' × ' + logoImage.naturalHeight + '）';
        if (contentInput.value.trim()) generateQRCode();
      } catch (err) {
        logoImage = null;
        logoFileName = '';
        logoStatus.textContent = '未能讀取圖片。';
        setMessage(err.message || '未能讀取圖片。', 'error');
      }
    });
    [logoSizeRange, paddingRange, marginRange].forEach(input => {
      input.addEventListener('input', () => {
        updateRangeLabels();
        if (contentInput.value.trim()) generateQRCode();
      });
    });
    [sizeSelect, levelSelect, positionSelect, whiteBgCheck].forEach(input => {
      input.addEventListener('change', () => {
        if (positionSelect.value !== 'outside-bottom-right' && levelSelect.value !== 'H') {
          setMessage('提示：圖片放在 QR Code 內部時，建議使用 H 容錯級別。', 'warn');
        }
        if (contentInput.value.trim()) generateQRCode();
      });
    });
    contentInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') generateQRCode();
    });
    generateBtn.addEventListener('click', generateQRCode);
    downloadBtn.addEventListener('click', downloadPNG);
    clearLogoBtn.addEventListener('click', clearLogo);
    clearBtn.addEventListener('click', clearAll);
    updateRangeLabels();
    drawPlaceholder();
  </script>
</body>
</html>
